<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meeting Chatbot</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f8;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: stretch;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 720px;
            height: 100vh;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: #f7f7f8;
        }

        .message {
            max-width: 80%;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-message {
            margin-left: auto;
            background-color: #dcfce7;
            color: #333;
            border: 1px solid #bbf7d0;
        }

        .bot-message {
            margin-right: auto;
            background-color: #e0e7ff;
            color: #333;
            border: 1px solid #c7d2fe;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #e2e8f0;
            background-color: #fff;
        }

        .input-area input {
            flex-grow: 1;
            padding: 12px 15px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }

        .input-area button {
            margin-left: 10px;
            padding: 12px 20px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .input-area button:hover {
            background-color: #4338ca;
        }

        /* Scrollbar styling */
        .chat-box::-webkit-scrollbar {
            width: 6px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }
        .header {
    display: flex;
    align-items: flex-start;
    padding: 15px 20px;
    background-color: #ffffff;
    border-bottom: 1px solid #e2e8f0;
}

.user-info {
    display: flex;
    flex-direction: column;
    font-size: 15px;
    color: #374151;
}

.logout-button {
    margin-top: 8px;
    background-color: #ef4444;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    width: fit-content;
    transition: background-color 0.3s;
}

.logout-button:hover {
    background-color: #dc2626;
}


    </style>
    <script>
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chat-box');

            const userMessage = document.createElement('div');
            userMessage.classList.add('message', 'user-message');
            userMessage.innerText = message;
            chatBox.appendChild(userMessage);
            inputField.value = "";

            chatBox.scrollTop = chatBox.scrollHeight;

            const res = await fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'question=' + encodeURIComponent(message)
            });

            const data = await res.json();
            const botMessage = document.createElement('div');
            botMessage.classList.add('message', 'bot-message');
            botMessage.innerText = data.answer;
            chatBox.appendChild(botMessage);

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        window.onload = function() {
        const chatBox = document.getElementById('chat-box');
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    </script>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div>Logged in as <strong>{{ full_name }}</strong></div>
            <a class="logout-button" href="/logout">Logout</a>
        </div>
    </div>
    
    
    <div class="chat-container">
        <div class="chat-box" id="chat-box">
            {% for chat in chats %}
                <div class="message {% if chat.sender == 'user' %}user-message{% else %}bot-message{% endif %}">
                    {{ chat.message }}
                </div>
            {% endfor %}
            {% if summary %}
                <div class="message bot-message">
                    {{ summary }}
                </div>
            {% endif %}
        </div>        
    

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your message..." onkeydown="if(event.key === 'Enter') sendMessage();">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

</body>
</html>
